{% extends "base.html" %}
{% block content %}
<style>
  /* karty zadan "Teraz pracuje nad": kazda osobno, kolor paska = grupa zadania */
  .lj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 18px; margin: 8px 0 28px; }
  .lj { background: #fff; border: 1px solid #dfe3d6; border-left: 6px solid #7a8a76; border-radius: 10px; padding: 14px 16px 12px;
        box-shadow: 0 1px 3px rgba(31, 42, 31, .08); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .lj-zrodla { border-left-color: #2f6db5; } .lj-wiedza { border-left-color: #2f7d3a; } .lj-przepisy { border-left-color: #c27c0e; }
  .lj-sieci { border-left-color: #6b4fbb; } .lj-agenci { border-left-color: #6b7568; }
  .lj-stale { background: #fffaf0; }
  .lj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .lj-titles { min-width: 0; }
  .lj-group { font-size: .72em; text-transform: uppercase; letter-spacing: .06em; color: #6b7568; font-weight: 600; }
  .lj h3 { margin: 2px 0 0; font-size: 1.08em; line-height: 1.3; }
  .lj h3 a { color: inherit; text-decoration: none; } .lj h3 a:hover { text-decoration: underline; }
  .lj-id { color: #8a9486; font-weight: 400; font-size: .85em; }
  .lj-subject { margin: 3px 0 0; color: #3d4a3c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lj-stop button { padding: 4px 10px; font-size: .85em; }
  .lj-progress { display: flex; align-items: center; gap: 10px; }
  .lj-progress .bar { flex: 1; height: 10px; }
  .lj-zrodla .bar div { background: #2f6db5; } .lj-przepisy .bar div { background: #c27c0e; } .lj-sieci .bar div { background: #6b4fbb; }
  .lj-count { font-variant-numeric: tabular-nums; font-size: .9em; color: #3d4a3c; white-space: nowrap; }
  .lj-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; font-size: .88em; }
  .lj-meta div { display: flex; gap: 6px; } .lj-meta dt { color: #8a9486; } .lj-meta dd { margin: 0; font-variant-numeric: tabular-nums; }
  .lj-now { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; background: #f6f7f2; border-radius: 8px; padding: 8px 10px; font-size: .9em; }
  .lj-step { background: #fff1c2; border-radius: 10px; padding: 1px 8px; font-size: .9em; }
  .lj-detail { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lj-age { color: #8a9486; font-size: .85em; white-space: nowrap; }
  .lj-warn { margin: 0; background: #fff1c2; border-radius: 8px; padding: 8px 10px; font-size: .88em; }
  .lj-log { list-style: none; margin: 0; padding: 0; border-top: 1px solid #eceee6; font-size: .8em;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .lj-log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px dotted #e3e6dc; }
  .lj-log li:last-child { border-bottom: 0; }
  .lj-log time { color: #8a9486; }
  .lj-log span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; color: #2b352a; }
  @media (max-width: 560px) { .lj { padding: 12px; } .lj-log li { grid-template-columns: 1fr; gap: 0; } }
</style>
<h1>Na zywo <span class="muted" style="font-size:.5em">odswiezane co 2 s</span></h1>
<div id="live" hx-get="/monitor/live" hx-trigger="every 2s" hx-swap="innerHTML">
  {% include "monitor_live.html" %}
</div>
{% endblock %}
