<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f2; color: #1f2a1f; }
    nav { background: #2f5d3a; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; white-space: nowrap; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 7px 10px; border-bottom: 1px solid #e3e6dc; text-align: left; vertical-align: top; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .card { background: #fff; padding: 14px 18px; border-radius: 8px; min-width: 110px; }
    .card b { font-size: 1.6em; display: block; }
    form.box { background: #fff; padding: 14px; border-radius: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    input, button, select { padding: 6px 10px; }
    .muted { color: #6b7568; font-size: .9em; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .85em; background: #e3e6dc; }
    .tag.recipe { background: #d7ecd9; } .tag.fact { background: #dbe6f5; } .tag.other { background: #eee; color: #777; }
    .tag.running { background: #fff1c2; } .tag.queued { background: #e6e0f5; } .tag.ready { background: #d7ecd9; } .tag.degraded { background: #fff1c2; } .tag.done { background: #d7ecd9; } .tag.failed { background: #f6d5d5; } .tag.cancelled { background: #eee; }
    pre.log { background: #1f2a1f; color: #d8e6d5; padding: 12px; border-radius: 8px; max-height: 480px; overflow: auto; white-space: pre-wrap; font-size: .85em; }
    .bar { background: #e3e6dc; border-radius: 6px; height: 12px; overflow: hidden; } .bar div { background: #2f5d3a; height: 100%; }
    .inline { display: inline; }
    .bulkbar { position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    /* male ekrany: tabele przewijane w poziomie, formularze na cala szerokosc */
    @media (max-width: 760px) {
      main { margin: 12px auto; padding: 0 10px; }
      table { display: block; overflow-x: auto; white-space: nowrap; }
      form.box input:not([type=checkbox]), form.box select, form.box button { flex: 1 1 140px; }
      nav { padding: 8px 10px; font-size: .95em; }
      h1 { font-size: 1.4em; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/">{{ app_name }}</a>
    <a href="/monitor">Na zywo</a>
    <a href="/tasks">Zadania do zrobienia</a>
    <a href="/agents">Agenci</a>
    <a href="/site">Strona</a>
    <a href="/sources">Zrodla</a>
    <a href="/scrapers">Scrapery</a>
    <a href="/plants">Rosliny</a>
    <a href="/discover">Odkrywanie</a>
    <a href="/items">Zebrane</a>
    <a href="/export">Eksport</a>
    <a href="/posts">Fanpage</a>
    <a href="/jobs">Zadania</a>
    <a href="/llm">LLM</a>
    <a href="/docs">API</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
